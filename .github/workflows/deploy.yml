name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          echo "::warning::NODE_VERSION: $(node -v) | NPM_VERSION: $(npm -v)"
          npm install 2>&1 | while IFS= read -r line; do echo "::warning::$line"; done
          if [ ! -d "node_modules/vite" ]; then
            for f in /home/runner/.npm/_logs/*.log; do
              if [ -f "$f" ]; then
                echo "::error::LOG FILE: $f"
                tail -n 30 "$f" | while IFS= read -r line; do echo "::warning::DEBUG_LOG: $line"; done
              fi
            done
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
